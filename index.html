<style>
/* Layout: one narrow column like a call sheet; bottom tabs on phones, top tabs on wide screens; titles open in a sheet. */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --ink: #14161c;
  --muted: #5d6472;
  --line: #d9dce4;
  --chip: #e3e6ed;
  --gold: #8f5f00;
  --gold-fill: #f0b429;
  --on-gold: #1a1305;
  --good: #1b7448;
  --bad: #b4372f;
  --display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1116; --surface: #181b23; --ink: #eceef3; --muted: #98a0b0; --line: #2a2f3b; --chip: #232734;
    --gold: #f2bd45; --gold-fill: #f2bd45; --on-gold: #1a1305; --good: #5cc98f; --bad: #f0877d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1116; --surface: #181b23; --ink: #eceef3; --muted: #98a0b0; --line: #2a2f3b; --chip: #232734;
  --gold: #f2bd45; --gold-fill: #f2bd45; --on-gold: #1a1305; --good: #5cc98f; --bad: #f0877d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
:focus-visible { outline: 2px solid var(--gold-fill); outline-offset: 2px; border-radius: 4px; }
a { color: var(--gold); }
a.tab, a.btn { text-decoration: none; color: inherit; }
a.btn.gold { color: var(--on-gold); }
.tab[aria-current="page"] { color: var(--on-gold) !important; }
.wrap { max-width: 720px; margin: 0 auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; font: 700 26px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.mark { width: 22px; height: 22px; border-radius: 5px; background: repeating-linear-gradient(-45deg, var(--gold-fill) 0 6px, var(--ink) 6px 12px); }
.tabs-top { display: none; gap: 4px; }
.tab { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; color: var(--muted); font: 600 15px var(--body); }
.tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--on-gold); background: var(--gold-fill); }
.tabs-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-bottom .tab { flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 18px; border-radius: 12px; }
@media (min-width: 720px) {
  .tabs-top { display: flex; }
  .tabs-bottom { display: none; }
  body { padding-block: 0 48px; }
}

/* shared bits */
h2 { font: 600 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.pad { padding: 14px 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--chip); font-weight: 600; font-size: 14px; }
.btn.gold { background: var(--gold-fill); color: var(--on-gold); }
.btn.sm { padding: 5px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--chip); font: 500 11px/1.7 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.pill.watching { background: var(--gold-fill); color: var(--on-gold); }
.pill.watched { color: var(--good); }
.pill.watchlist { color: var(--ink); }
.err { color: var(--bad); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--gold-fill); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

/* search */
.search { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; align-self: flex-start; }
.seg button { padding: 6px 16px; border-radius: 999px; font: 600 14px var(--body); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
.field { display: flex; gap: 8px; }
.field input[type=search], .field input[type=text] { flex: 1; min-width: 0; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 16px; max-width: 100%; }
textarea { width: 100%; resize: vertical; min-height: 72px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--gold-fill); color: var(--on-gold); }

/* lists */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 16px; border-top: 1px solid var(--line); }
.rows > li:first-child .row { border-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font: 600 20px/1.15 var(--display); letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.tile { flex: 0 0 170px; scroll-snap-align: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; justify-content: space-between; }
.stars { letter-spacing: 2px; color: var(--gold); font-size: 14px; }

/* credits */
.credits { list-style: none; margin: 0; padding: 0; }
.credit { padding: 10px 0; border-top: 1px solid var(--line); }
.credits > .credit:first-child { border-top: 0; }
.credit-main { display: flex; align-items: baseline; gap: 8px; width: 100%; }
.credit .nm { font: 600 19px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.credit .dots { flex: 1; min-width: 12px; border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
.credit .role { color: var(--muted); font-size: 14px; text-align: right; max-width: 45%; overflow-wrap: anywhere; }
.seen { margin-top: 3px; font-size: 13px; color: var(--gold); font-weight: 600; }
.also { margin-top: 1px; font-size: 13px; color: var(--muted); }
.more { margin: 8px 0 2px; padding: 8px 12px; background: var(--bg); border-radius: 10px; }
.more .row { padding: 8px 0; border-top: 1px solid var(--line); }
.more > :first-child .row { border-top: 0; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgb(8 9 12 / .6); }
.panel { position: relative; width: 100%; max-width: 680px; max-height: 94%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
@media (min-width: 720px) { .sheet { align-items: center; } .panel { border-radius: 20px; max-height: 88%; } }
.panel-bar { position: sticky; top: 0; display: flex; justify-content: flex-end; background: var(--bg); padding: 6px 0; z-index: 2; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--chip); font-size: 22px; line-height: 1; text-align: center; }
.sh-title { font: 700 40px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.sh-meta { font: 400 13px var(--mono); color: var(--muted); margin: 8px 0 10px; }
.status { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.status .chip { display: inline-flex; align-items: center; }
.banner { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.banner.ok { border-color: var(--good); }
.banner.no { border-color: var(--bad); }
.banner b { display: block; font: 600 18px var(--display); text-transform: uppercase; letter-spacing: .05em; }
.banner.ok b { color: var(--good); }
.banner.no b { color: var(--bad); }
.offers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; max-width: 90%; }
.hero { padding: 18px 16px; }
.hero p { margin: 6px 0 12px; }
.hero .t { font: 700 30px/1.05 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.kv { display: grid; grid-template-columns: 1fr; gap: 6px; }
label.l { display: block; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
select { max-width: 100%; }
.sp { height: 8px; }
</style>

<header class="top"><div class="top-in">
  <div class="logo"><span class="mark" aria-hidden="true"></span>Typecast</div>
  <nav class="tabs-top" id="tabs-top" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs-bottom" id="tabs-bottom" aria-label="Sections"></nav>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <section class="panel" role="dialog" aria-modal="true" aria-label="Title details">
    <div class="panel-bar"><button class="x" data-act="close" aria-label="Close">&times;</button></div>
    <div id="sh-body"></div>
  </section>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
'use strict';
var K = 'typecast.v1';
var COUNTRIES = [['US','United States'],['GB','United Kingdom'],['CA','Canada'],['AU','Australia'],['NZ','New Zealand'],['IE','Ireland'],['DE','Germany'],['AT','Austria'],['CH','Switzerland'],['FR','France'],['BE','Belgium'],['NL','Netherlands'],['LU','Luxembourg'],['ES','Spain'],['PT','Portugal'],['IT','Italy'],['SE','Sweden'],['NO','Norway'],['DK','Denmark'],['FI','Finland'],['IS','Iceland'],['PL','Poland'],['CZ','Czechia'],['SK','Slovakia'],['HU','Hungary'],['RO','Romania'],['BG','Bulgaria'],['GR','Greece'],['HR','Croatia'],['SI','Slovenia'],['RS','Serbia'],['UA','Ukraine'],['LT','Lithuania'],['LV','Latvia'],['EE','Estonia'],['TR','Turkey'],['IL','Israel'],['AE','United Arab Emirates'],['SA','Saudi Arabia'],['EG','Egypt'],['ZA','South Africa'],['IN','India'],['JP','Japan'],['KR','South Korea'],['SG','Singapore'],['HK','Hong Kong'],['TW','Taiwan'],['TH','Thailand'],['PH','Philippines'],['ID','Indonesia'],['MX','Mexico'],['BR','Brazil'],['AR','Argentina'],['CL','Chile'],['CO','Colombia']];
var SERVICES = ['Netflix','Prime Video','Disney+','Max','Apple TV+','Hulu','Paramount+','Peacock','Crunchyroll','MUBI','Criterion Channel','Sky','WOW','Canal+','BBC iPlayer','ARD Mediathek','ZDF','Joyn','RTL+','YouTube'];
var STATUS = { watching: 'Watching', watchlist: 'To watch', watched: 'Watched' };

/* ---------- helpers ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function tid(t, y, ty) { return norm(t).replace(/ /g, '-') + '-' + (y || '0') + '-' + (ty === 'tv' ? 'tv' : 'm'); }
function typeLabel(t) { return t === 'tv' ? 'Series' : 'Film'; }
function cname(cc) { for (var i = 0; i < COUNTRIES.length; i++) if (COUNTRIES[i][0] === cc) return COUNTRIES[i][1]; return cc; }
function guessCountry() {
  try { var m = (navigator.language || '').split('-')[1]; if (m && cname(m.toUpperCase()) !== m.toUpperCase()) return m.toUpperCase(); } catch (e) {}
  return 'US';
}
function fresh() { return { v: 1, updatedAt: 0, country: guessCountry(), services: [], lib: {}, titles: {}, people: {} }; }
function migrate(r) { var f = fresh(); for (var k in f) if (r[k] === undefined) r[k] = f[k]; return r; }
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600); }
function stars(n) { n = n || 0; return '★'.repeat(n) + '☆'.repeat(5 - n); }

/* ---------- state + storage ---------- */
var state;
try { state = migrate(JSON.parse(localStorage.getItem(K))); } catch (e) { state = fresh(); }
if (!state || typeof state !== 'object') state = fresh();
function persistLocal() { try { localStorage.setItem(K, JSON.stringify(state)); } catch (e) {} }
var ref = null, cloud = 'off', pushT;
function save() { state.updatedAt = Date.now(); persistLocal(); push(); }
function push() {
  if (!ref) return;
  clearTimeout(pushT);
  pushT = setTimeout(function () {
    ref.set({ json: JSON.stringify(state), updatedAt: state.updatedAt }).then(function () { cloud = 'on'; }, function () { cloud = 'err'; syncNote(); });
  }, 1500);
}
function adopt(d) {
  try {
    var r = JSON.parse(d.json);
    if (r && r.updatedAt > state.updatedAt) { state = migrate(r); persistLocal(); renderAll(); }
  } catch (e) {}
}

/* ---------- capabilities ---------- */
var sample = null, db = null, userCap = null, downloads = null;
function useCap(n) { try { return window.claude && window.claude.use ? window.claude.use(n).catch(function () { return null; }) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } }
Promise.all([useCap('sample'), useCap('db'), useCap('user'), useCap('downloads')]).then(function (r) {
  sample = r[0]; db = r[1]; userCap = r[2]; downloads = r[3];
  if (ui.tab === 'setup') renderSetup();
  initCloud();
});
function initCloud() {
  if (!db || !userCap) { syncNote(); return; }
  userCap.id().then(function (id) {
    if (!id) { syncNote(); return; }
    ref = db.collection('data/users/' + id).doc('typecast');
    return ref.get().then(function (s) {
      if (s.exists) adopt(s.data()); else if (state.updatedAt) push();
      cloud = 'on'; syncNote();
      ref.onSnapshot(function (sn) { if (sn.exists) adopt(sn.data()); }, function () {});
    });
  }).catch(function () { cloud = 'off'; syncNote(); });
}
function syncNote() {
  var el = $('#sync'); if (!el) return;
  el.textContent = ref && cloud !== 'err' ? 'Synced to your Claude account, so your list follows you across devices.' : cloud === 'err' ? 'Sync failed. Your list is still saved on this device.' : 'Saved on this device only. Open Typecast from claude.ai while signed in to sync across devices.';
}

/* ---------- asking Claude ---------- */
var JSONONLY = 'Reply with one JSON object only. No prose and no code fences. Never reveal plot twists or spoilers.';
function ask(prompt) {
  if (!sample) return Promise.reject({ code: 'unavailable' });
  return sample.json(JSONONLY + '\n' + prompt, { modelTier: 'default' });
}
function errMsg(e) {
  if (e && e.code === 'unavailable') return 'Lookups run through Claude. Open Typecast from claude.ai to use them.';
  if (e && e.code === 'not_granted') return 'Typecast needs your permission to ask Claude. Allow it and try again.';
  if (e && e.code === 'rate_limited') return 'Too many lookups in a row. Wait a moment and try again.';
  return 'That lookup did not work. Try again.';
}
function qSearch(q) {
  return ask('The user wants to find a film or TV show matching "' + q + '". Return {"matches":[{"title":string,"year":number (first release year),"type":"movie" or "tv","blurb":"max 12 words, no spoilers"}]} with up to 4 real productions, most likely first.');
}
function qPerson(name, exclude) {
  return ask('Person: "' + name + '" (an actor, or a director if they are not primarily an actor). Return {"name":canonical full name,"known":[{"title":string,"year":number,"type":"movie" or "tv","role":character name or "Director"}]} with up to 10 of their most widely recognised film and TV credits, most recognisable first.' + (exclude ? ' Leave out "' + exclude + '".' : ''));
}
function qDetails(t) {
  return ask('Production: "' + t.title + '"' + (t.year ? ' (' + t.year + ')' : '') + ', ' + (t.type === 'tv' ? 'a TV series' : 'a film') + '. Return {"overview":"1-2 spoiler-free sentences","meta":"short line such as \'2h 10m · Drama, Thriller\' or \'3 seasons · Crime\'","cast":[{"name":string,"role":character name,"top":[{"title":string,"year":number}]}],"related":[{"title":string,"year":number,"type":"movie" or "tv","relation":"short, e.g. Sequel, Prequel, Remake, Same universe, Same director, Similar"}]}. cast: up to 14 main and notable supporting actors in billing order; top = their 3 most widely recognised OTHER credits, excluding this production. related: up to 6. If you do not recognise the production return {"error":"unknown"}.');
}
function qLinks(t, libTitles) {
  return ask('Cast of "' + t.title + '" (' + (t.year || '') + '): ' + JSON.stringify(t.cast.map(function (c) { return c.name; })) + '. The user has these titles in their library: ' + JSON.stringify(libTitles) + '. For each cast member, list which of the library titles they appeared in (use the library title strings exactly; only appearances you are confident about). Return {"links":[{"name":string,"in":[string]}]} and leave out cast members with no matches.');
}
function qWho(t, ep, desc, castNames) {
  return ask('The user is watching "' + t.title + '"' + (t.year ? ' (' + t.year + ')' : '') + (ep ? ', ' + ep : '') + ' and asks who this is: "' + desc + '". Known cast: ' + JSON.stringify(castNames) + '. Return {"name":actor or null if unsure,"role":character,"confidence":"high" or "medium" or "low","knownFrom":[{"title":string,"year":number}] (up to 5 other well-known credits),"note":"one short spoiler-free sentence"}.');
}
function qAvail(t, cc, services) {
  return ask('Where can "' + t.title + '"' + (t.year ? ' (' + t.year + ')' : '') + ' (' + (t.type === 'tv' ? 'TV series' : 'film') + ') be watched legally in ' + cname(cc) + ' (' + cc + ')? The user subscribes to: ' + JSON.stringify(services) + '. Return {"offers":[{"service":"usual brand name","kind":"stream" or "free" or "rent" or "buy"}],"confidence":"high" or "medium" or "low","note":"max 20 words, mention if the title is new or the info may be dated"}. Only list services you believe carry it in that country.');
}

/* ---------- library lookups ---------- */
function libIndex() {
  var m = {};
  for (var id in state.lib) { var t = state.titles[id]; if (t) m[norm(t.title)] = id; }
  return m;
}
function statusOfTitle(title, idx) { var id = (idx || libIndex())[norm(title)]; return id ? state.lib[id].status : null; }
function seenIn(name, excludeId) {
  var n = norm(name), out = [], idx = libIndex(), seen = {};
  function add(title) { var k = norm(title); if (idx[k] && idx[k] !== excludeId && !seen[k]) { seen[k] = 1; out.push(state.titles[idx[k]].title); } }
  for (var id in state.lib) {
    if (id === excludeId) continue;
    var t = state.titles[id];
    if (t && t.cast) t.cast.forEach(function (c) { if (norm(c.name) === n) add(t.title); });
  }
  var cur = state.titles[excludeId];
  if (cur) {
    if (cur.links) for (var k in cur.links) if (norm(k) === n) cur.links[k].forEach(add);
    (cur.cast || []).forEach(function (c) { if (norm(c.name) === n) (c.top || []).forEach(function (x) { add(x.title); }); });
  }
  var p = state.people[n];
  if (p) p.known.forEach(function (x) { add(x.title); });
  return out;
}
function sharedCast(id) {
  var t = state.titles[id], res = [];
  if (!t || !t.cast) return res;
  var mine = {}; t.cast.forEach(function (c) { mine[norm(c.name)] = c.name; });
  for (var o in state.lib) {
    if (o === id) continue;
    var ot = state.titles[o]; if (!ot || !ot.cast) continue;
    var names = ot.cast.filter(function (c) { return mine[norm(c.name)]; }).map(function (c) { return c.name; });
    if (names.length) res.push({ id: o, title: ot.title, year: ot.year, names: names });
  }
  return res.sort(function (a, b) { return b.names.length - a.names.length; }).slice(0, 8);
}
function suggestions() {
  var idx = libIndex(), map = {};
  for (var id in state.lib) {

  if (!s.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<h2>Shares cast with your library</h2><div class="card"><ul class="rows">' + s.map(function (x) {
    return '<li><button class="row" data-act="open-id" data-id="' + esc(x.id) + '"><span class="row-main"><span class="row-title" style="font-size:17px">' + esc(x.title) + '</span><span class="row-sub">' + esc(x.names.slice(0, 4).join(', ')) + '</span></span><span class="pill ' + state.lib[x.id].status + '">' + STATUS[state.lib[x.id].status] + '</span></button></li>';
  }).join('') + '</ul></div>';
}
function sheetRel() {
  var id = ui.sheet; if (!id) return;
  var t = state.titles[id], el = $('#sh-rel'); if (!el) return;
  if (!t.related || !t.related.length) { el.innerHTML = ''; return; }
  var idx = libIndex();
  el.innerHTML = '<h2>Related</h2><div class="card"><ul class="rows">' + t.related.map(function (r, i) {
    var st = statusOfTitle(r.title, idx);
    return '<li><button class="row" data-act="open-rel" data-i="' + i + '"><span class="row-main"><span class="row-title" style="font-size:17px">' + esc(r.title) + '</span><span class="row-sub">' + esc(r.year) + ' · ' + esc(r.relation || 'Related') + '</span></span>' + (st ? '<span class="pill ' + st + '">' + STATUS[st] + '</span>' : '') + '</button></li>';
  }).join('') + '</ul></div>';
}
function sheetNotes() {
  var id = ui.sheet, l = state.lib[id], el = $('#sh-notes'); if (!el) return;
  el.innerHTML = '<h2>Notes</h2><textarea id="note" aria-label="Notes" placeholder="Your thoughts, who recommended it, where you stopped">' + esc(l ? l.note : '') + '</textarea><p class="small muted" id="note-hint" style="margin:4px 0 0">' + (l ? '' : 'Mark this title Watching, To watch or Watched to keep notes.') + '</p>';
}

/* ---------- events ---------- */
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act, id = ui.sheet;
  if (a === 'close') closeSheet();
  else if (a === 'mode') { ui.mode = b.dataset.v; ui.res = null; renderCast(); }
  else if (a === 'try') { ui.mode = b.dataset.mode; ui.q = b.dataset.q; renderCast(); doSearch(); }
  else if (a === 'open-match') openMeta(ui.res.data.matches[+b.dataset.i]);
  else if (a === 'open-known') openMeta(ui.res.sorted[+b.dataset.i]);
  else if (a === 'open-id') openSheet(b.dataset.id);
  else if (a === 'open-sug') openMeta(ui.sug[+b.dataset.i]);
  else if (a === 'sug-add') { var s = ui.sug[+b.dataset.i], nid = ensureTitle(s); setStatus(nid, 'watchlist'); toast('Added to To watch'); renderLibrary(); }
  else if (a === 'filter') { ui.filter = b.dataset.v; renderLibrary(); }
  else if (a === 'status') { setStatus(id, b.dataset.v); sheetHead(); sheetNotes(); sheetCast(); sheetConn(); if (b.dataset.v) toast('Saved to ' + STATUS[b.dataset.v]); }
  else if (a === 'rate') { var l = state.lib[id]; l.rating = l.rating === +b.dataset.v ? 0 : +b.dataset.v; save(); sheetHead(); }
  else if (a === 'reload') loadDetails(id);
  else if (a === 'relink') relink(id, false);
  else if (a === 'avail') checkAvail();
  else if (a === 'open-rel') openMeta(state.titles[id].related[+b.dataset.i]);
  else if (a === 'open-pk') openMeta(state.people[norm(state.titles[id].cast[+b.dataset.p].name)]._view[+b.dataset.j]);
  else if (a === 'actor') {
    var i = +b.dataset.i, c = state.titles[id].cast[i], key = norm(c.name);
    if (ui.openActor === i) { ui.openActor = null; sheetCast(); return; }
    ui.openActor = i; sheetCast();
    if (!state.people[key]) {
      qPerson(c.name, state.titles[id].title).then(function (d) {
        state.people[key] = { name: c.name, known: (d && d.known) || [], at: Date.now() }; save();
        if (ui.sheet === id) { sheetCast(); }
      }, function (e) { state.people[key] = { name: c.name, known: [], err: errMsg(e) }; delete state.people[key]; if (ui.openActor === i) { var el = $('#am-' + i); if (el) el.innerHTML = '<div class="more err">' + esc(errMsg(e)) + '</div>'; } });
    }
  }
  else if (a === 'svc') { var v = b.dataset.v, k = state.services.indexOf(v); if (k >= 0) state.services.splice(k, 1); else state.services.push(v); save(); renderSetup(); }
  else if (a === 'export') {
    if (!downloads) { toast('Saving files is not available in this view.'); return; }
    downloads.save({ filename: 'typecast-backup.json', data: JSON.stringify(state, null, 2) }).then(function () { toast('Backup saved'); }, function () {});
  }
});
document.addEventListener('submit', function (ev) {
  var f = ev.target; ev.preventDefault();
  if (f.id === 'sform') { ui.q = $('#q').value; doSearch(); }
  else if (f.id === 'svcform') { var v = $('#svcnew').value.trim(); if (v && state.services.indexOf(v) < 0) { state.services.push(v); save(); } renderSetup(); }
  else if (f.id === 'whoform') {
    var d = $('#who-d').value.trim(); if (!d) return;
    var id = ui.sheet, t = state.titles[id], out = $('#who-r');
    out.innerHTML = '<span class="muted"><span class="spin"></span>Thinking</span>';
    qWho(t, $('#who-e').value.trim(), d, (t.cast || []).map(function (c) { return c.name; })).then(function (r) {
      if (!r || !r.name) { out.innerHTML = '<span class="muted">Not sure who that is. Try describing them differently.</span>'; return; }
      var idx = libIndex();
      out.innerHTML = '<div class="row-title">' + esc(r.name) + '</div><div class="row-sub">as ' + esc(r.role || 'this character') + ' · ' + esc(r.confidence || '') + ' confidence</div>' + (r.knownFrom && r.knownFrom.length ? '<div class="seen">Known from: ' + r.knownFrom.map(function (k) { var st = statusOfTitle(k.title, idx); return esc(k.title) + (st ? ' (' + STATUS[st].toLowerCase() + ')' : ''); }).join(', ') + '</div>' : '') + (r.note ? '<div class="small muted">' + esc(r.note) + '</div>' : '');
    }, function (e) { out.innerHTML = '<span class="err">' + esc(errMsg(e)) + '</span>'; });
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'q') ui.q = t.value;
  else if (t.id === 'lq') { ui.lq = t.value; var pos = t.selectionStart; renderLibrary(); var n = $('#lq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (t.id === 'note') { var l = state.lib[ui.sheet]; if (l) { l.note = t.value; clearTimeout(input.t); input.t = setTimeout(save, 600); } }
});
function input() {}
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'cc') { state.country = t.value; save(); toast('Country set to ' + cname(t.value)); }
  else if (t.id === 'imp' && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function () {
      try { var r = migrate(JSON.parse(fr.result)); if (!r.lib || !r.titles) throw 0; state = r; save(); renderSetup(); toast('Backup imported'); } catch (e) { toast('That file is not a Typecast backup.'); }
    };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) closeSheet(); });

route();
})();
</script>

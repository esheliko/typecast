<style>
/* Layout: one narrow column like a call sheet; bottom tabs on phones, top tabs on wide screens; titles and people open in a sheet. */
:root {
  --bg: #eef0f4; --surface: #ffffff; --ink: #14161c; --muted: #5d6472; --line: #d9dce4; --chip: #e3e6ed;
  --gold: #8f5f00; --gold-fill: #f0b429; --on-gold: #1a1305; --good: #1b7448; --bad: #b4372f;
  --display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1116; --surface: #181b23; --ink: #eceef3; --muted: #98a0b0; --line: #2a2f3b; --chip: #232734;
    --gold: #f2bd45; --gold-fill: #f2bd45; --on-gold: #1a1305; --good: #5cc98f; --bad: #f0877d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1116; --surface: #181b23; --ink: #eceef3; --muted: #98a0b0; --line: #2a2f3b; --chip: #232734;
  --gold: #f2bd45; --gold-fill: #f2bd45; --on-gold: #1a1305; --good: #5cc98f; --bad: #f0877d; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 96px; min-height: 100vh; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
:focus-visible { outline: 2px solid var(--gold-fill); outline-offset: 2px; border-radius: 4px; }
a { color: var(--gold); }
a.tab, a.btn { text-decoration: none; color: inherit; }
a.btn.gold { color: var(--on-gold); }
img { max-width: 100%; }
.wrap { max-width: 720px; margin: 0 auto; }

.top { position: sticky; top: 0; z-index: 20; background: var(--bg); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; font: 700 26px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.mark { width: 22px; height: 22px; border-radius: 5px; background: repeating-linear-gradient(-45deg, var(--gold-fill) 0 6px, var(--ink) 6px 12px); }
.tabs-top { display: none; gap: 4px; }
.tab { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; color: var(--muted); font: 600 15px var(--body); }

.tab[aria-current="page"] { color: var(--on-gold) !important; background: var(--gold-fill); }
.tabs-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-bottom .tab { flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 18px; border-radius: 12px; }
@media (min-width: 720px) { .tabs-top { display: flex; } .tabs-bottom { display: none; } body { padding-bottom: 48px; } }

h2 { font: 600 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.pad { padding: 14px 16px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .mono { font-family: var(--mono); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--chip); font-weight: 600; font-size: 14px; }
.btn.gold { background: var(--gold-fill); color: var(--on-gold); }
.btn.sm { padding: 5px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--chip); font: 500 11px/1.7 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.pill.watching { background: var(--gold-fill); color: var(--on-gold); }
.pill.watched { color: var(--good); }
.pill.watchlist { color: var(--ink); }
.err { color: var(--bad); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--gold-fill); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

.search { margin-top: 8px; }
.field { display: flex; gap: 8px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 16px; max-width: 100%; }
.field input { flex: 1; min-width: 0; padding: 13px 16px; border-radius: 12px; }
textarea { width: 100%; resize: vertical; min-height: 72px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--gold-fill); color: var(--on-gold); }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; border-top: 1px solid var(--line); }
.rows > li:first-child .row { border-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font: 600 20px/1.15 var(--display); letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; display: block; }
.thumb { width: 44px; height: 64px; border-radius: 6px; background: var(--chip); object-fit: cover; flex: none; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--chip); object-fit: cover; flex: none; display: grid; place-items: center; font: 600 16px var(--display); color: var(--muted); }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.tile { flex: 0 0 132px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; }
.tile img, .tile .ph { width: 132px; height: 190px; border-radius: 10px; object-fit: cover; background: var(--chip); }
.tile .row-title { font-size: 17px; }
.stars { letter-spacing: 2px; color: var(--gold); font-size: 14px; }

.credits { list-style: none; margin: 0; padding: 0; }
.credit { padding: 10px 0; border-top: 1px solid var(--line); }
.credits > .credit:first-child { border-top: 0; }
.credit-main { display: flex; align-items: center; gap: 12px; width: 100%; }
.credit-line { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.credit .nm { font: 600 19px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.credit .dots { flex: 1; min-width: 12px; border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
.credit .role { color: var(--muted); font-size: 14px; text-align: right; max-width: 45%; overflow-wrap: anywhere; }
.marks { padding-left: 56px; }
.seen { margin-top: 3px; font-size: 13px; color: var(--gold); font-weight: 600; }
.also { margin-top: 1px; font-size: 13px; color: var(--muted); }
.more { margin: 8px 0 2px; padding: 8px 12px; background: var(--bg); border-radius: 10px; }
.more .row { padding: 8px 0; }

.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgb(8 9 12 / .6); }
.panel { position: relative; width: 100%; max-width: 680px; max-height: 94%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
@media (min-width: 720px) { .sheet { align-items: center; } .panel { border-radius: 20px; max-height: 88%; } }
.panel-bar { position: sticky; top: 0; display: flex; justify-content: space-between; background: var(--bg); padding: 6px 0; z-index: 2; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--chip); font-size: 22px; line-height: 1; text-align: center; }
.sh-top { display: flex; gap: 14px; align-items: flex-start; }
.sh-poster { width: 96px; border-radius: 10px; flex: none; background: var(--chip); }
.sh-title { font: 700 38px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.sh-meta { font: 400 13px var(--mono); color: var(--muted); margin: 8px 0 0; }
.status { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.banner { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.banner.ok { border-color: var(--good); } .banner.no { border-color: var(--bad); }
.banner b { display: block; font: 600 18px var(--display); text-transform: uppercase; letter-spacing: .05em; }
.banner.ok b { color: var(--good); } .banner.no b { color: var(--bad); }
.prov { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.prov .g { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 56px; }
.prov img { width: 36px; height: 36px; border-radius: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; max-width: 90%; }
.hero { padding: 18px 16px; }
.hero p { margin: 6px 0 12px; }
.hero .t { font: 700 30px/1.05 var(--display); text-transform: uppercase; letter-spacing: .03em; }
label.l { display: block; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.sp { height: 12px; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline input[type=number] { width: 72px; }
.foot { margin: 36px 0 0; font-size: 12px; color: var(--muted); }
</style>

<body>
<header class="top"><div class="top-in">
  <div class="logo"><span class="mark" aria-hidden="true"></span>Typecast</div>
  <nav class="tabs-top" id="tabs-top" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs-bottom" id="tabs-bottom" aria-label="Sections"></nav>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <section class="panel" role="dialog" aria-modal="true" aria-label="Details">
    <div class="panel-bar"><button class="x" data-act="back" id="back" aria-label="Back" hidden>&#8249;</button><span></span><button class="x" data-act="close" aria-label="Close">&times;</button></div>
    <div id="sh-body"></div>
  </section>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
'use strict';

/* ================= basics ================= */
var K = 'typecast.v2';
var LANG = navigator.language || 'en-US';
var IMG = 'https://image.tmdb.org/t/p/';
var COUNTRIES = 'US GB CA AU NZ IE DE AT CH FR BE NL LU ES PT IT SE NO DK FI IS PL CZ SK HU RO BG GR HR SI RS UA LT LV EE TR IL AE SA EG ZA IN JP KR SG HK TW TH PH ID MX BR AR CL CO'.split(' ');
var STATUS = { watching: 'Watching', watchlist: 'To watch', watched: 'Watched' };
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function img(p, size) { return p ? IMG + size + p : ''; }
function typeLabel(t) { return t === 'tv' ? 'Series' : 'Film'; }
function stars(n) { n = n || 0; return '★'.repeat(n) + '☆'.repeat(5 - n); }
function cname(cc) { try { return new Intl.DisplayNames([LANG], { type: 'region' }).of(cc) || cc; } catch (e) { return cc; } }

/* ================= state ================= */

var state = (function () { try { var s = JSON.parse(localStorage.getItem(K)); if (s && s.v === 2) return Object.assign(fresh(), s); } catch (e) {} return fresh(); })();

/* ================= cache (IndexedDB) ================= */
var idb = (function () {
  var p;
  function open() {
    return p || (p = new Promise(function (res, rej) {
      var r = indexedDB.open('typecast', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('c'); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    }));
  }
  return {
    get: function (k) { return open().then(function (db) { return new Promise(function (res) { var q = db.transaction('c').objectStore('c').get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(undefined); }; }); }).catch(function () { return undefined; }); },
    set: function (k, v) { return open().then(function (db) { db.transaction('c', 'readwrite').objectStore('c').put(v, k); }).catch(function () {}); }
  };
})();
function cached(key, ttl, fn) {
  key = LANG + '|' + key;
  return idb.get(key).then(function (h) {
    if (h && Date.now() - h.at < ttl) return h.v;
    return fn().then(function (v) { idb.set(key, { at: Date.now(), v: v }); return v; }, function (e) { if (h) return h.v; throw e; });
  });
}

/* ================= TMDB ================= */
function ApiError(code, msg) { this.code = code; this.message = msg; }
function tmdb(path, params) {

  var u = new URL('https://api.themoviedb.org/3' + path);
  u.searchParams.set('language', LANG);

    if (r.status === 404) throw new ApiError('404', 'Not found on TMDB.');
    if (r.status === 429) throw new ApiError('rate', 'TMDB is busy. Try again in a moment.');
    if (!r.ok) throw new ApiError('http', 'TMDB returned an error (' + r.status + ').');
    return r.json();
  }, function () { throw new ApiError('net', 'Cannot reach TMDB. Check your connection.'); });
}
function yr(d) { return (d || '').slice(0, 4); }
function item(type, r) { return { key: type + ':' + r.id, type: type, id: r.id, title: r.title || r.name || '', year: yr(r.release_date || r.first_air_date), poster: r.poster_path || null }; }

function search(q) {
  return cached('s|' + q.toLowerCase(), 3600e3, function () {
    return tmdb('/search/multi', { query: q, include_adult: 'false' }).then(function (d) {
      return (d.results || []).filter(function (r) { return r.media_type === 'movie' || r.media_type === 'tv' || r.media_type === 'person'; }).slice(0, 14).map(function (r) {
        if (r.media_type === 'person') return { kind: 'person', id: r.id, name: r.name, photo: r.profile_path, dept: r.known_for_department, kf: (r.known_for || []).map(function (k) { return k.title || k.name; }).slice(0, 3) };
        var o = item(r.media_type, r); o.kind = 'title'; o.overview = r.overview; return o;
      });
    });
  });
}
function trending() {
  return cached('trend', 3600e3, function () {
    return tmdb('/trending/all/week').then(function (d) { return (d.results || []).filter(function (r) { return r.media_type === 'movie' || r.media_type === 'tv'; }).slice(0, 12).map(function (r) { return item(r.media_type, r); }); });
  });
}
function getTitle(type, id) {
  return cached('t|' + type + '|' + id, 6 * 3600e3, function () {
    var ap = (type === 'tv' ? 'aggregate_credits' : 'credits') + ',watch/providers,recommendations';
    return tmdb('/' + type + '/' + id, { append_to_response: ap }).then(function (d) {
      var cast = (type === 'tv' ? (d.aggregate_credits || {}).cast : (d.credits || {}).cast) || [];
      var pr = (d['watch/providers'] || {}).results || {}, prov = {};
      Object.keys(pr).forEach(function (cc) {
        var o = pr[cc]; prov[cc] = { link: o.link };
        ['flatrate', 'free', 'ads', 'rent', 'buy'].forEach(function (g) { if (o[g]) prov[cc][g] = o[g].map(function (p) { return { id: p.provider_id, name: p.provider_name, logo: p.logo_path }; }); });
      });
      var t = item(type, d);
      t.overview = d.overview; t.tagline = d.tagline; t.genres = (d.genres || []).map(function (g) { return g.name; });
      t.runtime = type === 'movie' ? d.runtime : (d.episode_run_time || [])[0];
      t.status = d.status;
      t.crew = type === 'tv' ? (d.created_by || []).map(function (p) { return p.name; }) : ((d.credits || {}).crew || []).filter(function (c) { return c.job === 'Director'; }).map(function (c) { return c.name; });
      t.seasons = type === 'tv' ? (d.seasons || []).filter(function (s) { return s.season_number > 0; }).map(function (s) { return { n: s.season_number, eps: s.episode_count }; }) : [];
      t.people = cast.slice(0, 24).map(function (c) { return { id: c.id, name: c.name, photo: c.profile_path, role: type === 'tv' ? ((c.roles || [])[0] || {}).character || '' : c.character || '' }; });
      t.prov = prov;
      t.collection = d.belongs_to_collection ? d.belongs_to_collection.id : null;
      t.related = ((d.recommendations || {}).results || []).slice(0, 8).map(function (r) { var o = item(type, r); o.rel = 'Recommended'; return o; });
      return t;
    });
  });
}
function getCollection(id) {
  return cached('c|' + id, 7 * 864e5, function () {
    return tmdb('/collection/' + id).then(function (d) {
      return (d.parts || []).sort(function (a, b) { return (a.release_date || '9').localeCompare(b.release_date || '9'); }).map(function (r) { var o = item('movie', r); o.rel = 'Same collection'; return o; });
    });
  });
}
var BAD_ROLE = /\b(self|himself|herself|themselves|archive footage|uncredited)\b/i;
function getPerson(id) {
  return cached('p|' + id, 7 * 864e5, function () {
    return tmdb('/person/' + id, { append_to_response: 'combined_credits' }).then(function (d) {
      var cc = d.combined_credits || {}, seen = {}, known = [];

        if (r.media_type !== 'movie' && r.media_type !== 'tv') return;
        var o = item(r.media_type, r); if (seen[o.key]) return; seen[o.key] = 1;
        o.role = role; o.votes = r.vote_count || 0; known.push(o);

      return { id: d.id, name: d.name, photo: d.profile_path, dept: d.known_for_department, bio: (d.biography || '').slice(0, 360), known: known.slice(0, 60) };
    });
  });
}

function marksHtml(p, curKey) {
  var hits = p.known.filter(function (k) { return state.lib[k.key] && k.key !== curKey; });
  var also = p.known.filter(function (k) { return !state.lib[k.key] && k.key !== curKey; }).slice(0, 3);
  return (hits.length ? '<div class="seen">You know them from: ' + esc(hits.slice(0, 4).map(function (k) { return k.title + (k.year ? ' (' + k.year + ')' : ''); }).join(', ')) + '</div>' : '') +
    (also.length ? '<div class="also">Also in: ' + esc(also.map(function (k) { return k.title; }).join(', ')) + '</div>' : '');
}
function enrich(g, people, curKey, tok, conn) {
  var queue = people.slice(0, 20), links = {}, done = 0;
  function next() {
    var c = queue.shift(); if (!c) return Promise.resolve();
    return getPerson(c.id).then(function (p) {
      ui.people[p.id] = p;
      if (tok !== ui.rs) return;
      var el = $('#mk-' + g + '-' + c.id); if (el) el.innerHTML = marksHtml(p, curKey);
      p.known.forEach(function (k) { if (state.lib[k.key] && k.key !== curKey) (links[k.key] = links[k.key] || []).push(p.name); });
    }, function () {}).then(next);
  }
  var workers = []; for (var i = 0; i < 5; i++) workers.push(next());
  Promise.all(workers).then(function () {
    if (!conn || tok !== ui.rs) return;
    var el = $('#sh-conn'); var keys = Object.keys(links).sort(function (a, b) { return links[b].length - links[a].length; }).slice(0, 8);
    if (!el || !keys.length) return;
    el.innerHTML = '<h2>Connected to your library</h2><div class="card"><ul class="rows">' + keys.map(function (k) {
      var l = state.lib[k];
      return '<li><button class="row" data-act="open-title" data-key="' + esc(k) + '">' + (l.poster ? '<img class="thumb" src="' + img(l.poster, 'w92') + '" alt="" loading="lazy">' : '<span class="thumb"></span>') + '<span class="row-main"><span class="row-title" style="font-size:17px">' + esc(l.title) + '</span><span class="row-sub">' + esc(links[k].slice(0, 4).join(', ')) + '</span></span>' + pill(k) + '</button></li>';
    }).join('') + '</ul></div>';
  });
}
function drawerHtml(p) {
  var hits = p.known.filter(function (k) { return state.lib[k.key]; }), rest = p.known.filter(function (k) { return !state.lib[k.key]; });
  var list = hits.concat(rest).slice(0, 10);
  return '<div class="more">' + list.map(function (k) {
    return '<button class="row" data-act="open-title" data-key="' + esc(k.key) + '">' + (k.poster ? '<img class="thumb" style="width:34px;height:50px" src="' + img(k.poster, 'w92') + '" alt="" loading="lazy">' : '<span class="thumb" style="width:34px;height:50px"></span>') + '<span class="row-main"><span class="row-title" style="font-size:16px">' + esc(k.title) + '</span><span class="row-sub">' + esc(k.year) + ' · ' + typeLabel(k.type) + (k.role ? ' · ' + esc(k.role) : '') + '</span></span>' + pill(k.key) + '</button>';
  }).join('') + '<button class="btn sm" data-act="open-person" data-id="' + p.id + '" style="margin-top:8px">Full profile</button></div>';
}
function drawPerson(p) {
  var hits = p.known.filter(function (k) { return state.lib[k.key]; });
  function rows(list) {
    return '<div class="card"><ul class="rows">' + list.map(function (k) {
      return '<li><button class="row" data-act="open-title" data-key="' + esc(k.key) + '">' + (k.poster ? '<img class="thumb" src="' + img(k.poster, 'w92') + '" alt="" loading="lazy">' : '<span class="thumb"></span>') + '<span class="row-main"><span class="row-title" style="font-size:17px">' + esc(k.title) + '</span><span class="row-sub">' + esc(k.year) + ' · ' + typeLabel(k.type) + (k.role ? ' · ' + esc(k.role) : '') + '</span></span>' + pill(k.key) + '</button></li>';
    }).join('') + '</ul></div>';
  }
  $('#sh-body').innerHTML = '<div class="sh-top">' + (p.photo ? '<img class="sh-poster" src="' + img(p.photo, 'w185') + '" alt="">' : '') + '<div style="min-width:0"><h1 class="sh-title">' + esc(p.name) + '</h1><div class="sh-meta">' + esc(p.dept || '') + '</div></div></div>' + (p.bio ? '<p class="small muted" style="margin:14px 0 0">' + esc(p.bio) + (p.bio.length >= 360 ? '…' : '') + '</p>' : '') +
    (hits.length ? '<h2>In your library</h2>' + rows(hits) : '') + '<h2>Known for</h2>' + rows(p.known.filter(function (k) { return !state.lib[k.key]; }).slice(0, 30));
}

/* ================= library actions ================= */
function setStatus(t, s) {
  if (!s) delete state.lib[t.key];
  else { var cur = state.lib[t.key] || { key: t.key, type: t.type, id: t.id, title: t.title, year: t.year, poster: t.poster, added: Date.now(), rating: 0, note: '' }; cur.status = s; state.lib[t.key] = cur; }
  save();
}

/* ================= events ================= */
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act, t = ui.cur;
  if (a === 'close') closeSheet();
  else if (a === 'back') { ui.stack.pop(); showSheet(); }
  else if (a === 'retry') showSheet();
  else if (a === 'open-title') open(pk(b.dataset.key));
  else if (a === 'open-person') open({ kind: 'person', id: +b.dataset.id });
  else if (a === 'filter') { ui.filter = b.dataset.v; renderLibrary(); }
  else if (a === 'sug-add') { var s = ui.sug[b.dataset.key].r; setStatus({ key: s.key, type: s.type, id: s.id, title: s.title, year: s.year, poster: s.poster }, 'watchlist'); toast('Added to To watch'); renderLibrary(); }
  else if (a === 'status') { setStatus(t, b.dataset.v); $('#sh-head').innerHTML = headHtml(t); notesHtml(t); if (b.dataset.v) toast('Saved to ' + STATUS[b.dataset.v]); }
  else if (a === 'rate') { var l = state.lib[t.key], v = +b.dataset.v; l.rating = l.rating === v ? 0 : v; save(); $('#sh-head').innerHTML = headHtml(t); }
  else if (a === 'actor') {
    var g = b.dataset.g, id = b.dataset.id, dr = $('#dr-' + g + '-' + id), key = g + '-' + id;
    if (dr.innerHTML) { dr.innerHTML = ''; b.setAttribute('aria-expanded', 'false'); return; }
    b.setAttribute('aria-expanded', 'true');
    if (ui.people[id]) dr.innerHTML = drawerHtml(ui.people[id]);
    else { dr.innerHTML = '<div class="more muted"><span class="spin"></span>Loading credits</div>'; getPerson(+id).then(function (p) { ui.people[id] = p; if (dr.innerHTML) dr.innerHTML = drawerHtml(p); }, function (e) { dr.innerHTML = '<div class="more err">' + esc(errMsg(e)) + '</div>'; }); }
  }
  else if (a === 'svc') {
    var sid = b.dataset.id, i = state.services.map(String).indexOf(sid);
    if (i >= 0) state.services.splice(i, 1); else { state.services.push(+sid); state.svcNames[sid] = b.dataset.name; }
    save(); b.setAttribute('aria-pressed', i < 0);
  }
  else if (a === 'export') {
    var url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    var d = document.createElement('a'); d.href = url; d.download = 'typecast-backup.json'; document.body.appendChild(d); d.click(); d.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  else if (a === 'install' && installEvt) { installEvt.prompt(); installEvt = null; }
});
document.addEventListener('submit', function (ev) {
  var f = ev.target; ev.preventDefault();
  if (f.id === 'sform') { ui.q = $('#q').value; clearTimeout(searchT); doSearch(); }
  else if (f.id === 'tokform') {
    state.token = $('#tok').value.trim(); save();
    if (!state.token) { toast('Token removed'); renderSvc(); return; }
    tmdb('/configuration').then(function () { toast('Connected to TMDB'); renderSvc(); }, function (e) { toast(errMsg(e)); });
  }
  else if (f.id === 'epform') {
    var s = +$('#ep-s').value, e = +$('#ep-e').value, out = $('#ep-res'), t = ui.cur, tok = ui.rs;
    if (!e || e < 1) return;
    out.innerHTML = '<span class="muted"><span class="spin"></span>Loading</span>';
    var l = state.lib[t.key]; if (l) { l.progress = { s: s, e: e }; save(); }
    getEpisode(t.id, s, e).then(function (ep) {
      if (tok !== ui.rs) return;
      var all = ep.guests.concat(ep.cast.filter(function (c) { return !ep.guests.some(function (g) { return g.id === c.id; }); }));
      out.innerHTML = '<div class="row-title" style="font-size:18px">' + esc(ep.name || '') + '</div>' + (l ? '<div class="small muted">Progress saved: S' + s + ' E' + e + '</div>' : '') +
        (ep.guests.length ? '<div class="mono small muted" style="margin:10px 0 0">GUEST STARS</div>' : '') + '<ul class="credits" id="cl-ep">' + all.map(function (c) { return creditRow('ep', c); }).join('') + '</ul>' + (all.length ? '' : '<p class="muted small">No cast listed for this episode.</p>');
      enrich('ep', all, t.key, tok, false);
    }, function (er) { out.innerHTML = '<span class="err">' + esc(er.code === '404' ? 'That episode is not on TMDB.' : errMsg(er)) + '</span>'; });
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'q') { ui.q = t.value; clearTimeout(searchT); if (t.value.trim().length > 1) searchT = setTimeout(doSearch, 450); }
  else if (t.id === 'lq') { ui.lq = t.value; var pos = t.selectionStart; renderLibrary(); var n = $('#lq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (t.id === 'svq') { ui.svq = t.value; renderSvc(); }
  else if (t.id === 'note') { var l = state.lib[ui.cur.key]; if (l) { l.note = t.value; clearTimeout(save.t); save.t = setTimeout(save, 500); } }
  else if (t.id === 'cfilter') { var q = t.value.trim().toLowerCase(); document.querySelectorAll('#cl-cast .credit').forEach(function (li) { li.hidden = q && li.dataset.q.indexOf(q) < 0; }); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'cc') { state.country = t.value; save(); renderSvc(); }
  else if (t.id === 'imp' && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { try { var r = JSON.parse(fr.result); if (!r || r.v !== 2 || !r.lib) throw 0; var tok = state.token; state = Object.assign(fresh(), r); if (!state.token) state.token = tok; save(); renderSetup(); toast('Backup imported'); } catch (e) { toast('That file is not a Typecast backup.'); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.stack.length) closeSheet(); });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
route();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<title>Typecast</title>
<!--
  The installed app's start page (manifest start_url). The service worker serves it from its cache, so the app paints the
  Browse skeleton at once instead of holding the splash screen while the server wakes up; it then loads "/" in its place.
  The browser keeps this page on screen until "/" has something to show. Self-contained on purpose: no bundles, no data.
-->
<script>try{var t=localStorage.getItem("tc-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  :root { --bg:#eef0f4; --surface:#fff; --ink:#14161c; --muted:#5d6472; --line:#d9dce4; --chip:#e3e6ed; --gold-fill:#f0b429; --on-gold:#1a1305; --gold:#8f5f00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1116; --surface:#181b23; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b; --chip:#232734; --gold-fill:#f2bd45; --gold:#f2bd45; } }
  :root[data-theme="dark"] { --bg:#0f1116; --surface:#181b23; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b; --chip:#232734; --gold-fill:#f2bd45; --gold:#f2bd45; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; overflow:hidden; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width:720px; margin:0 auto; }
  .top { display:flex; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top, 0px)) 0 10px; }
  .logo { display:flex; align-items:center; gap:10px; font:700 26px/1 "Barlow Condensed","Arial Narrow",Impact,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
  .mark { width:22px; height:22px; border-radius:5px; background:repeating-linear-gradient(-45deg, var(--gold-fill) 0 6px, var(--ink) 6px 12px); }
  .sk { background:var(--chip); border-radius:8px; animation:pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity:1; } to { opacity:.45; } }
  .wlink { display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; line-height:18px; }
  .wlink svg { width:18px; height:18px; stroke:var(--gold); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding-top:12px; }
  .chips .sk { width:92px; height:34px; border-radius:999px; }
  .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px 10px; margin-top:14px; }
  .poster { aspect-ratio:2/3; border-radius:10px; }
  .tabs { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-around; background:var(--surface); border-top:1px solid var(--line);
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tab { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; font-weight:600; padding:6px 18px; border-radius:12px; color:var(--muted); }
  .tab.on { background:var(--gold-fill); color:var(--on-gold); }
  .tab svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  @media (min-width: 720px) { .tabs { display:none; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation:none; } }
</style>
</head>
<body>
<div class="wrap" aria-busy="true">
  <div class="top"><div class="logo"><span class="mark" aria-hidden="true"></span>Typecast</div>
    <span class="wlink"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>Watching</span></div>
  <!-- Same shape as app/(app)/loading.tsx (6 chips, then the poster grid), so the hand-over to the real skeleton does not jump. -->
  <div class="chips" aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div class="grid" aria-hidden="true">
    <div><div class="sk poster"></div><div class="sk" style="width:80%;height:14px;margin-top:9px"></div><div class="sk" style="width:45%;height:11px;margin-top:6px"></div></div>
    <div><div class="sk poster"></div><div class="sk" style="width:80%;height:14px;margin-top:9px"></div><div class="sk" style="width:45%;height:11px;margin-top:6px"></div></div>
    <div><div class="sk poster"></div><div class="sk" style="width:80%;height:14px;margin-top:9px"></div><div class="sk" style="width:45%;height:11px;margin-top:6px"></div></div>
    <div><div class="sk poster"></div><div class="sk" style="width:80%;height:14px;margin-top:9px"></div><div class="sk" style="width:45%;height:11px;margin-top:6px"></div></div>
    <div><div class="sk poster"></div><div class="sk" style="width:80%;height:14px;margin-top:9px"></div><div class="sk" style="width:45%;height:11px;margin-top:6px"></div></div>
    <div><div class="sk poster"></div><div class="sk" style="width:80%;height:14px;margin-top:9px"></div><div class="sk" style="width:45%;height:11px;margin-top:6px"></div></div>
  </div>
</div>
<nav class="tabs" aria-hidden="true">
  <span class="tab on"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Browse</span>
  <span class="tab"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9h16M9 4v16"/></svg>Library</span>
  <span class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</span>
</nav>
<script>
  // Paint first, then go: the browser keeps this skeleton up until the real page can paint.
  requestAnimationFrame(function () { setTimeout(function () { location.replace("/"); }, 0); });
</script>
</body>
</html>
